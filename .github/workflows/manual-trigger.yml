---
name: Manual Trigger Workflow

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for running"
        required: false
        default: "Manual execution"
      dry-run:
        description: "Dry run mode" 
        required: false
        default: true
        type: boolean
      target_url:
        description: "URL to check pre/post scan"
        required: false
        default: "https://ampel-ztf.zeuthen.desy.de/api/catalogmatch/catalogs/"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo trigger info
        run: |
          echo "Triggered manually!"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Dry run: ${{ github.event.inputs.dry-run }}"

      - name: Check target endpoint availability
        id: check_endpoint
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://ampel-ztf.zeuthen.desy.de/api/catalogmatch/catalogs/' }}
        run: |
          response=$(curl -sS --max-time 5 "$TARGET_URL") || {
            echo "::error title=Target Endpoint Unreachable::Failed to reach $TARGET_URL within 5 seconds."
            exit 1
          }
          echo "Target endpoint ($TARGET_URL) is reachable."

      - name: Run nmap scan on DESY domain
        run: |
          docker run --rm instrumentisto/nmap -v -A desy.de

      - name: Verify target endpoint post-scan
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://ampel-ztf.zeuthen.desy.de/api/catalogmatch/catalogs/' }}
        run: |
          if curl -sS --max-time 5 "$TARGET_URL" >/dev/null; then
            echo "::error title=Target Still Reachable::Endpoint should NOT be reachable after scan."
            exit 1
          fi
